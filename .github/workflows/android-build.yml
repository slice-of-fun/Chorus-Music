name: Chorus

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Decode Keystore
      env:
        ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo $ENCODED_KEYSTORE | base64 -di > keystore.jks

    - name: Build Release APK
      env:
        SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        SIGNING_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=$(pwd)/keystore.jks \
          -Pandroid.injected.signing.store.password=$SIGNING_STORE_PASSWORD \
          -Pandroid.injected.signing.key.alias=$SIGNING_KEY_ALIAS \
          -Pandroid.injected.signing.key.password=$SIGNING_KEY_PASSWORD

    - name: Rename APK
      run: |
        mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Chorus-Music.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Chorus-Music-APK
        path: app/build/outputs/apk/release/Chorus-Music.apk

    - name: Get Version Name
      id: get_version
      run: |
        VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
        echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v${{ steps.get_version.outputs.version }}"
        name: "Chorus Music - v${{ steps.get_version.outputs.version }}"
        files: app/build/outputs/apk/release/Chorus-Music.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
