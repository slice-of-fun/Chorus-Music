name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decrypt Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            mkdir -p app/keystore
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore
          else
            echo "Signing keystore not provided. Building unsigned or debug build."
            # Create a mock keystore file to prevent Gradle configuration phase from failing if it checks file existence
            mkdir -p app/keystore
            touch app/keystore/release.keystore
          fi

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build FOSS & GMS Release APKs
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'androiddebugkey' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          # Build universal APKs for FOSS and GMS variants
          ./gradlew assembleUniversalFossRelease assembleUniversalGmsRelease --build-cache --configuration-cache -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" -Dkotlin.daemon.jvmargs="-Xmx2g"

      - name: Prepare APKs for Upload
        run: |
          mkdir -p build-artifacts
          # Copy universal FOSS release APK
          if [ -f app/build/outputs/apk/universalFoss/release/app-universal-foss-release.apk ]; then
            cp app/build/outputs/apk/universalFoss/release/app-universal-foss-release.apk build-artifacts/ChorusMusic-FOSS-Universal.apk
          elif [ -f app/build/outputs/apk/fossUniversal/release/app-foss-universal-release.apk ]; then
            # Alternate layout name path
            cp app/build/outputs/apk/fossUniversal/release/app-foss-universal-release.apk build-artifacts/ChorusMusic-FOSS-Universal.apk
          else
            # Find any APK built under foss release
            find app/build/outputs/apk/ -name "*release*.apk" -path "*foss*" -exec cp {} build-artifacts/ChorusMusic-FOSS-Universal.apk \;
          fi
          
          # Copy universal GMS release APK
          if [ -f app/build/outputs/apk/universalGms/release/app-universal-gms-release.apk ]; then
            cp app/build/outputs/apk/universalGms/release/app-universal-gms-release.apk build-artifacts/ChorusMusic-GMS-Universal.apk
          elif [ -f app/build/outputs/apk/gmsUniversal/release/app-gms-universal-release.apk ]; then
            # Alternate layout name path
            cp app/build/outputs/apk/gmsUniversal/release/app-gms-universal-release.apk build-artifacts/ChorusMusic-GMS-Universal.apk
          else
            # Find any APK built under gms release
            find app/build/outputs/apk/ -name "*release*.apk" -path "*gms*" -exec cp {} build-artifacts/ChorusMusic-GMS-Universal.apk \;
          fi

      - name: Upload Build Artifacts (Debug/Verify)
        uses: actions/upload-artifact@v4
        with:
          name: chorus-music-apks
          path: build-artifacts/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build-artifacts/ChorusMusic-FOSS-Universal.apk
            build-artifacts/ChorusMusic-GMS-Universal.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
