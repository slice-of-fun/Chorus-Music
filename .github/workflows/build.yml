name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.flavor }} APK
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flavor: [Foss, Gms]
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decrypt Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            mkdir -p app/keystore
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore
          else
            echo "Signing keystore not provided. Building unsigned or debug build."
            mkdir -p app/keystore
            touch app/keystore/release.keystore
          fi

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build ${{ matrix.flavor }} Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'androiddebugkey' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          ./gradlew assembleUniversal${{ matrix.flavor }}Release --parallel --build-cache --configuration-cache

      - name: Prepare APKs for Upload
        run: |
          mkdir -p build-artifacts
          find app/build/outputs/apk/ -name "*release*.apk" -exec cp {} build-artifacts/ChorusMusic-${{ matrix.flavor }}-Universal.apk \;

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chorus-music-apks-${{ matrix.flavor }}
          path: build-artifacts/*

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: chorus-music-apks-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
