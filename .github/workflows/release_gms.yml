name: Release GMS

on:
  push:
    tags:
      - 'v*' 
  workflow_dispatch:

jobs:
  build:
    name: Build and Release GMS
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore
          echo $KEYSTORE_BASE64 | base64 --decode > app/keystore/release.keystore

      - name: Build GMS Release APKs
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleUniversalGmsRelease assembleArm64GmsRelease assembleArmeabiGmsRelease assembleX86GmsRelease assembleX86_64GmsRelease

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "Chorus Music v1.0.1"
          generate_release_notes: false
          body: |
            ### 🎵 Chorus Music v1.0.1 — Bug Fix Release

            This release contains critical playback, playlist import, and Spotify login fixes.

            #### 🔴 Critical Fixes
            * **Song Playback Restored** — Fixed `validateStatus` probe blocking all 11 concurrent stream clients. Top-3 trusted clients now bypass the pre-flight check, songs play immediately.
            * **Stream URL Expiry Bug Fixed** — `expiresInSeconds` null no longer silently discards a valid stream URL (now defaults to 6 hours).
            * **IO Thread Deadlock Fixed** — Added a hard 30-second timeout on the URL resolver `runBlocking` call; multiple concurrent songs can now resolve without freezing.
            * **Cache Re-Fetch Bug Fixed** — Partially downloaded tracks no longer trigger unnecessary network re-fetches that failed on stressed servers.

            #### 🟠 Improvements
            * **Playlist Import** — Track matching retries YouTube search up to 3× with exponential backoff before dropping a song. Interrupted imports no longer leave playlists empty.
            * **Spotify Login — OTP Delivered** — Overrode WebView User-Agent to Chrome desktop, removing the `wv` fingerprint that caused Spotify to suppress OTP SMS codes.
            * **Spotify Login — Auth Email Fixed** — Security-verification redirect (`challenge.spotify.com`) is now in the cookie capture allow-list; email login completes correctly.
            * **Spotify Login — Loading Indicator** — Progress bar shown during OTP and verification intermediate pages.

            #### 📦 Installation
            Download the APK for your device architecture below.
            | APK | Architecture |
            |-----|-------------|
            | `*-universal-*` | All devices (recommended) |
            | `*-arm64-*` | Modern 64-bit ARM |
            | `*-armeabi-*` | Older 32-bit ARM |
            | `*-x86_64-*` | x86 64-bit emulator/tablet |
            | `*-x86-*` | x86 32-bit |
          files: |
            app/build/outputs/apk/**/*.apk
            changelog.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
