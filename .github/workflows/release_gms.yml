name: Release GMS

on:
  push:
    tags:
      - 'v*' 
  workflow_dispatch:

jobs:
  build:
    name: Build and Release GMS
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore
          echo $KEYSTORE_BASE64 | base64 --decode > app/keystore/release.keystore

      - name: Build GMS Release APKs
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleUniversalGmsRelease assembleArm64GmsRelease assembleArmeabiGmsRelease assembleX86GmsRelease assembleX86_64GmsRelease

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          generate_release_notes: true
          body: |
            ### 🎵 Chorus Music - Initial Release
            * **Ad-Free by Default**: Uninterrupted listening sessions.
            * **Lossless Audio**: Integrated support for high-fidelity FLAC streams.
            * **Next-Gen Lyrics**: Precise word-by-word syncing and translations.
            * **Smart Discovery**: Identify music playing in your surroundings.
            * **Discord RPC**: Show off what you're listening to on Discord.
            * **App Widgets**: Control playback right from your home screen.
          files: app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
